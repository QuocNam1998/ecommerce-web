<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#f5f5f5; padding:0; }
  .top { background:#fff; border-bottom:1px solid #f0f0f0; padding:14px 20px; display:flex; align-items:center; gap:.65rem; color:#ee4d2d; }
  .mark { display:inline-flex; align-items:center; justify-content:center; width:34px; height:38px; border-radius:6px 6px 10px 10px; background:#ee4d2d; color:#fff; font-size:24px; font-weight:700; }
  .name { font-size:20px; font-weight:600; line-height:1; }
  .divider { margin-left:.35rem; color:#222; font-size:22px; line-height:1; }
  .page { font-size:14px; color:#222; }
  .help { margin-left:auto; color:#ee4d2d; font-size:13px; }
</style>
</head>
<body>
  <div class="top">
    <span class="mark">🛍</span>
    <span class="name">Modern Market</span>
    <span class="divider">|</span>
    <span class="page">Login</span>
    <span class="help">Need help?</span>
  </div>
</body>
</html>
