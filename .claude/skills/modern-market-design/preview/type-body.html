<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--fg-1); padding: 20px; }
  .row { display: flex; flex-direction: column; gap: 10px; }
  .spec { display: flex; align-items: baseline; gap: 18px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  .spec:last-child { border-bottom: 0; }
  .label { width: 90px; flex-shrink:0; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; }
  .sample { flex: 1; }
</style>
</head>
<body>
  <div class="row">
    <div class="spec"><span class="label">H3 / Card</span><span class="sample" style="font-size:16px;font-weight:600;line-height:1.4">Aero Lamp</span></div>
    <div class="spec"><span class="label">Body</span><span class="sample" style="font-size:16px;font-weight:400;line-height:1.7">Shop an orange-marketplace style storefront with stacked promos and fast checkout.</span></div>
    <div class="spec"><span class="label">Body small</span><span class="sample" style="font-size:14px;font-weight:400;line-height:1.5">A brushed metal table lamp with warm dimming modes.</span></div>
    <div class="spec"><span class="label">Muted</span><span class="sample" style="font-size:14px;color:#6b6f76">Free shipping with marketplace voucher.</span></div>
    <div class="spec"><span class="label">Meta</span><span class="sample" style="font-size:12px;color:#6b6f76">4.9 rating · Sold 1.2k+</span></div>
  </div>
</body>
</html>
