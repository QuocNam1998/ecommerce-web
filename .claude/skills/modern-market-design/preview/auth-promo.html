<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:radial-gradient(circle at 28% 38%, rgba(255,190,74,.95) 0%, rgba(255,150,32,.9) 18%, rgba(255,127,14,0) 40%), radial-gradient(circle at 66% 54%, rgba(255,120,68,.34) 0%, rgba(255,120,68,0) 28%), linear-gradient(180deg,#ee4d2d,#e53d20); padding:24px; color:#fff; min-height:120px; }
  .row { display:flex; gap:14px; align-items:flex-start; }
  .pill { display:inline-flex; align-items:center; min-height:30px; padding:.35rem 1rem; border-radius:999px; background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.24); font-size:13px; font-weight:600; }
  .number { font-size:64px; font-weight:800; line-height:.85; text-shadow: 5px 7px 0 rgba(160,38,0,.32); }
  .sub { font-size:22px; font-weight:800; letter-spacing:.08em; line-height:.95; margin-top:6px; }
  .ticket { padding:.8rem; border-radius:22px; background:linear-gradient(180deg, rgba(255,255,255,.18), rgba(255,255,255,.1)); border:1px solid rgba(255,255,255,.16); box-shadow:0 18px 35px rgba(0,0,0,.14); backdrop-filter: blur(6px); text-transform:uppercase; min-width:120px; }
  .ticket span { font-size:11px; font-weight:700; letter-spacing:.08em; display:block; }
  .ticket strong { display:block; margin:.35rem 0 .2rem; color:#fff2a8; font-size:24px; line-height:.95; }
  .ticket small { font-size:10px; letter-spacing:.04em; line-height:1.3; display:block; }
</style>
</head>
<body>
  <div class="row">
    <div>
      <div class="pill">Modern Market</div>
      <div class="number">4.4</div>
      <div class="sub">MEGA SALE</div>
    </div>
    <div class="ticket"><span>Member</span><strong>25%</strong><small>vouchers daily</small></div>
    <div class="ticket"><span>FREESHIP</span><strong>$0</strong><small>delivery deals</small></div>
  </div>
</body>
</html>
