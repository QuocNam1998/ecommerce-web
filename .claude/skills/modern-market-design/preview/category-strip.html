<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#fff; padding:18px; }
  .strip { display:grid; grid-template-columns: repeat(8, 1fr); gap:.8rem; padding:1rem; border-top:1px solid #ebebeb; border-bottom:1px solid #ebebeb; }
  .chip { padding:.85rem .5rem; border-radius:14px; text-align:center; font-size:13px; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.08); }
</style>
</head>
<body>
  <div class="strip">
    <span class="chip">Electronics</span>
    <span class="chip">Home Living</span>
    <span class="chip">Fashion</span>
    <span class="chip">Beauty</span>
    <span class="chip">Sports</span>
    <span class="chip">Vouchers</span>
    <span class="chip">Groceries</span>
    <span class="chip">Gaming</span>
  </div>
</body>
</html>
