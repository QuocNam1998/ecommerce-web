<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--fg-1); padding: 20px; display:flex; flex-direction:column; gap:16px; }
  .row { display:flex; align-items:baseline; gap:18px; }
  .label { width: 90px; font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; }
  .eyebrow { font-size: 12px; font-weight:600; text-transform: uppercase; letter-spacing: .12em; color: #ee4d2d; }
  .price-lg { font-size: 32px; font-weight: 700; color: #ee4d2d; }
  .price { font-size: 22px; font-weight: 700; color: #ee4d2d; }
  .badge { font-size: 11px; font-weight: 600; letter-spacing:.04em; padding:.25rem .5rem; border-radius:999px; background:rgba(238,77,45,.92); color:#fff; display:inline-block; }
</style>
</head>
<body>
  <div class="row"><div class="label">Eyebrow</div><div class="eyebrow">Mega campaign</div></div>
  <div class="row"><div class="label">Price LG</div><div class="price-lg">$148.00</div></div>
  <div class="row"><div class="label">Price</div><div class="price">$96.00</div></div>
  <div class="row"><div class="label">Badge</div><div class="badge">Mall</div></div>
  <div class="row"><div class="label">CTA</div><div style="font-size:14px;font-weight:400;letter-spacing:0;text-transform:uppercase;background:#ee4d2d;color:#fff;padding:.6rem 1.2rem;border-radius:2px;display:inline-block">LOG IN</div></div>
</body>
</html>
