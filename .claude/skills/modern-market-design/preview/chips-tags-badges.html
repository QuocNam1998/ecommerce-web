<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#fff; padding:24px; color:#222; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px; }
  .chip { padding:.85rem 1rem; border-radius:14px; text-align:center; font-size:14px; background:#fff; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .tag { padding:.45rem .8rem; border-radius:999px; background:#f5f5f5; color:#555; font-size:13px; }
  .badge { padding:.25rem .5rem; border-radius:999px; font-size:11px; background:rgba(238,77,45,.92); color:#fff; }
  .pill { display:inline-flex; align-items:center; min-height:2.75rem; padding:.8rem 1rem; border-radius:999px; color:#fff; border:1px solid rgba(255,255,255,.35); background:rgba(255,255,255,.08); }
  .label { font-family: var(--font-mono); font-size:10px; color: var(--fg-2); text-transform: uppercase; letter-spacing: .04em; width:90px; }
  .onorange { background:linear-gradient(180deg,#f96f3a,#ee4d2d); padding:12px; border-radius:8px; display:inline-flex; }
</style>
</head>
<body>
  <div class="row"><div class="label">Category</div><span class="chip">Electronics</span><span class="chip">Home Living</span><span class="chip">Fashion</span></div>
  <div class="row"><div class="label">Tag</div><span class="tag">Bluetooth 5.3</span><span class="tag">14-hour battery</span><span class="tag">Stereo pairing</span></div>
  <div class="row"><div class="label">Badge</div><span class="badge">Mall</span><span class="badge" style="background:#26aa99">Free ship</span></div>
  <div class="row"><div class="label">Cart pill</div><div class="onorange"><span class="pill">Cart (3)</span></div></div>
</body>
</html>
