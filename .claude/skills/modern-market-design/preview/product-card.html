<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#f5f5f5; padding:20px; }
  .card { width: 260px; background:#fff; box-shadow: 0 2px 10px rgba(0,0,0,.08); border-radius:4px; overflow:hidden; }
  .image { position:relative; aspect-ratio:1; background:linear-gradient(135deg,#ffd0b8,#ffb89a); }
  .badge { position:absolute; top:.75rem; left:.75rem; padding:.25rem .5rem; border-radius:999px; font-size:11px; background:rgba(238,77,45,.92); color:#fff; }
  .body { display:grid; gap:.55rem; padding:.9rem; font-size:14px; }
  .cat { margin:0; font-size:12px; color:#ee4d2d; text-transform:uppercase; letter-spacing:.04em; }
  h3 { margin:0; font-size:16px; line-height:1.4; }
  .desc { margin:0; font-size:14px; color:#6b6f76; line-height:1.5; }
  .pricing { display:flex; justify-content:space-between; align-items:center; }
  .pricing strong { color:#ee4d2d; font-size:22px; }
  .pricing span { color:#26aa99; font-size:13px; }
  .meta { display:flex; justify-content:space-between; color:#6b6f76; font-size:12px; }
</style>
</head>
<body>
  <div class="card">
    <div class="image"><span class="badge">Mall</span></div>
    <div class="body">
      <p class="cat">Audio</p>
      <h3>Solstice Speaker</h3>
      <p class="desc">Portable room-filling sound wrapped in woven fabric.</p>
      <div class="pricing"><strong>$148</strong><span>Free shipping</span></div>
      <div class="meta"><span>4.9 rating</span><span>Sold 1.2k+</span></div>
    </div>
  </div>
</body>
</html>
