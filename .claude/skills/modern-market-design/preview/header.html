<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  body { margin: 0; font-family: var(--font-sans); background:#fff; padding:0; color:#222; }
  .header { box-shadow:0 1px 0 rgba(0,0,0,.08); }
  .promo { background:linear-gradient(180deg,#f96f3a 0%,#ee4d2d 100%); }
  .pin { width: min(calc(100% - 2rem), 1200px); margin: 0 auto; }
  .promo .inner {
    display:flex; justify-content:space-between; align-items:center;
    padding:.55rem 0 .45rem; font-size:13px; color:#fff;
  }
  .promo a { color:inherit; text-decoration:none; cursor:pointer; }
  .promo a:hover { opacity:.85; }
  .links { display:flex; align-items:center; gap:14px; }
  .sep { color: rgba(255,255,255,.6); }
  .iconlink { display:inline-flex; align-items:center; gap:6px; }
  .iconlink i { width: 16px; height: 16px; }
  .socials { display:inline-flex; align-items:center; gap:6px; margin-left:6px; }
  .socials i { width: 18px; height: 18px; }
  .chev { width: 14px; height: 14px; }

  .main { background:linear-gradient(180deg,#f96f3a 0%,#ee4d2d 100%); padding:.4rem 0 1rem; }
  .main .inner {
    display:grid; grid-template-columns: 200px 1fr 80px;
    gap:1.5rem; align-items:center;
  }
  .brand {
    color:#fff; display:flex; align-items:center; gap:8px; cursor:pointer;
  }
  .brand-mark {
    display:inline-flex; align-items:center; justify-content:center;
    width:42px; height:48px;
    background:#fff; color:#ee4d2d;
    border-radius:6px 6px 14px 14px;
    box-shadow: 0 2px 0 rgba(0,0,0,.05);
  }
  .brand-mark i { width: 26px; height: 26px; stroke-width: 2.2; }
  .brand-name {
    font-size: 30px; font-weight: 700; line-height: 1;
    letter-spacing: -0.01em;
  }

  .search { display:grid; gap:.5rem; }
  .bar {
    display:grid; grid-template-columns: 1fr 60px; gap:0;
    padding:4px; background:#fff; border-radius:2px;
  }
  .bar input {
    width:100%; border:0; padding:0 12px;
    min-height:34px; outline:none;
    font:inherit; font-size:14px; color:#222;
  }
  .bar input::placeholder { color: #b5b5b5; }
  .search-btn {
    border:0; min-height:34px; border-radius:2px;
    background:#ee4d2d; color:#fff;
    cursor:pointer; display:inline-flex;
    align-items:center; justify-content:center;
    transition: background 160ms ease;
  }
  .search-btn:hover { background: #d73211; }
  .search-btn i { width:18px; height:18px; stroke-width: 2.5; }
  .tags { display:flex; gap:14px; flex-wrap:wrap; color:#fff; font-size:12.5px; padding:0 4px; }
  .tags a { color:inherit; text-decoration:none; cursor:pointer; }
  .tags a:hover { opacity:.85; }

  .cart {
    justify-self: center;
    color:#fff; cursor:pointer; position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    padding: 4px;
  }
  .cart i { width: 32px; height: 32px; stroke-width: 1.8; }
  .cart-badge {
    position:absolute; top:-2px; right:-6px;
    min-width: 20px; height: 20px; padding: 0 6px;
    background:#fff; color:#ee4d2d;
    border-radius: 999px; font-size: 11px; font-weight: 600;
    display:inline-flex; align-items:center; justify-content:center;
    border: 1px solid #fff;
  }
</style>
</head>
<body>
  <header class="header">
    <div class="promo">
      <div class="inner pin">
        <div class="links">
          <a>Kênh Người Bán</a>
          <span class="sep">|</span>
          <a>Trở thành Người bán</a>
          <span class="sep">|</span>
          <a>Tải ứng dụng</a>
          <span class="sep">|</span>
          <span class="links" style="gap:6px">Kết nối <span class="socials">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>
          </span></span>
        </div>
        <div class="links">
          <a class="iconlink"><i data-lucide="bell"></i>Thông Báo</a>
          <a class="iconlink"><i data-lucide="circle-help"></i>Hỗ Trợ</a>
          <a class="iconlink"><i data-lucide="globe"></i>Tiếng Việt <i data-lucide="chevron-down" class="chev"></i></a>
          <span class="sep">|</span>
          <a>Đăng Ký</a>
          <span class="sep">|</span>
          <a>Đăng Nhập</a>
        </div>
      </div>
    </div>

    <div class="main">
      <div class="inner pin">
        <div class="brand">
          <span class="brand-mark"><i data-lucide="shopping-bag"></i></span>
          <span class="brand-name">Modern Market</span>
        </div>

        <div class="search">
          <div class="bar">
            <input placeholder="Modern Market bao ship 0Đ - Đăng ký ngay!" />
            <button class="search-btn" type="button"><i data-lucide="search"></i></button>
          </div>
          <div class="tags">
            <a>Kính Gương</a>
            <a>Áo Kiểu Babydoll</a>
            <a>Săn iPhone 0 Đồng</a>
            <a>Son Bóng Chính Hãng 100%</a>
            <a>Sục Crocs</a>
            <a>1k Điện Thoại</a>
            <a>Bánh Phơi Sương Nhiều Bơ</a>
          </div>
        </div>

        <div class="cart">
          <i data-lucide="shopping-cart"></i>
          <span class="cart-badge">3</span>
        </div>
      </div>
    </div>
  </header>

  <script>lucide.createIcons();</script>
</body>
</html>
