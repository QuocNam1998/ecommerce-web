<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; font-family: var(--font-sans); background:#fff; padding:18px; }
  .band { display:grid; grid-template-columns: repeat(4, 1fr); gap:1rem; }
  .card { display:grid; gap:.35rem; padding:1rem; border-radius:14px; background:#fff; box-shadow:0 2px 10px rgba(0,0,0,.08); }
  .card strong { color:#ee4d2d; font-size:14px; }
  .card span { color:#6b6f76; font-size:13px; line-height:1.4; }
</style>
</head>
<body>
  <div class="band">
    <article class="card"><strong>Free shipping</strong><span>Voucher-friendly checkout for selected orders</span></article>
    <article class="card"><strong>100% authentic</strong><span>Curated brands and premium home essentials</span></article>
    <article class="card"><strong>Daily deals</strong><span>New markdowns and campaign bundles every day</span></article>
    <article class="card"><strong>Secure payment</strong><span>Ready for card, wallet, and COD integrations</span></article>
  </div>
</body>
</html>
