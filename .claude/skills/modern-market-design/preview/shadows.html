<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #f5f5f5; color: var(--fg-1); padding: 28px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .card { background:#fff; padding:18px; min-height:90px; display:flex; flex-direction:column; justify-content:space-between; border-radius:4px; }
  .a { box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .b { box-shadow: 0 3px 10px rgba(0,0,0,.14); }
  .c { box-shadow: 0 22px 40px rgba(130,28,5,.25); }
  .d { box-shadow: 0 18px 35px rgba(0,0,0,.14); }
  .name { font-weight:600; font-size:13px; }
  .v { color: var(--fg-2); font-family: var(--font-mono); font-size: 10px; line-height: 1.4; word-break: break-all; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card a"><div class="name">Card · default</div><div class="v">0 2 10 / .08</div></div>
    <div class="card b"><div class="name">Card · raised</div><div class="v">0 3 10 / .14</div></div>
    <div class="card c"><div class="name">Promo card</div><div class="v">0 22 40 / .25 (warm)</div></div>
    <div class="card d"><div class="name">Promo ticket</div><div class="v">0 18 35 / .14</div></div>
  </div>
</body>
</html>
